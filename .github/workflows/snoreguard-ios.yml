name: SnoreGuard iOS

on:
  push:
    paths:
      - "SnoreGuard/**"
      - ".github/workflows/snoreguard-ios.yml"
  pull_request:
    paths:
      - "SnoreGuard/**"
      - ".github/workflows/snoreguard-ios.yml"
  workflow_dispatch:

concurrency:
  group: snoreguard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test on an iPhone simulator
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: SnoreGuard
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Runner images only ship simulators for some of their Xcodes, so use the first Xcode
      # (16.x preferred, then newer, then the image default) that has an iPhone simulator.
      - name: Pick Xcode and an iPhone simulator
        id: simulator
        run: |
          DEFAULT_XCODE=$(xcode-select -p | sed 's#/Contents/Developer$##')
          CANDIDATES="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V -r) $(ls -d /Applications/Xcode_2*.app 2>/dev/null | sort -V -r) $DEFAULT_XCODE"
          for APP in $CANDIDATES; do
            sudo xcode-select -s "$APP/Contents/Developer"
            ID=$(xcodebuild -project SnoreGuard.xcodeproj -scheme SnoreGuard -showdestinations 2>/dev/null \
              | grep "platform:iOS Simulator" | grep "name:iPhone" | grep -v "error" | tail -n 1 \
              | sed -E 's/.*id:([^,]+),.*/\1/')
            if [ -n "$ID" ]; then
              echo "Using $APP with simulator $ID"
              xcodebuild -version
              echo "id=$ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$APP has no iPhone simulator, trying the next Xcode"
          done
          xcrun simctl list runtimes
          echo "::error::No iPhone simulator available in any installed Xcode"
          exit 1

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project SnoreGuard.xcodeproj -scheme SnoreGuard \
            -destination "id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee build.log

      - name: Test
        run: |
          set -o pipefail
          xcodebuild -project SnoreGuard.xcodeproj -scheme SnoreGuard \
            -destination "id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log

      - name: Check for warnings and errors
        if: always()
        run: bash Tools/check_xcodebuild_warnings.sh build.log test.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs-simulator
          path: |
            SnoreGuard/build.log
            SnoreGuard/test.log
            SnoreGuard/issues.txt
          if-no-files-found: ignore

  # Compiles the app and tests with Xcode 16 (Swift 6.0). Building for the generic simulator
  # needs only the SDK, so this works even when the image has no Xcode 16 simulators.
  build-xcode-16:
    name: Build with Xcode 16
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: SnoreGuard
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE" ]; then echo "::error::No Xcode 16 on this runner image"; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app and tests
        run: |
          set -o pipefail
          xcodebuild -project SnoreGuard.xcodeproj -scheme SnoreGuard \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            clean build-for-testing 2>&1 | tee build.log

      - name: Check for warnings and errors
        if: always()
        run: bash Tools/check_xcodebuild_warnings.sh build.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs-xcode16
          path: |
            SnoreGuard/build.log
            SnoreGuard/issues.txt
          if-no-files-found: ignore
