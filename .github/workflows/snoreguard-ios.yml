name: SnoreGuard iOS

on:
  push:
    paths:
      - "SnoreGuard/**"
      - ".github/workflows/snoreguard-ios.yml"
  pull_request:
    paths:
      - "SnoreGuard/**"
      - ".github/workflows/snoreguard-ios.yml"
  workflow_dispatch:

concurrency:
  group: snoreguard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test on an iPhone simulator
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: SnoreGuard
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Runner images only ship simulators for some of their Xcodes, so use the first Xcode
      # (16.x preferred, then newer, then the image default) that has an iPhone simulator.
      - name: Pick Xcode and an iPhone simulator
        id: simulator
        run: |
          DEFAULT_XCODE=$(xcode-select -p | sed 's#/Contents/Developer$##')
          CANDIDATES="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V -r) $(ls -d /Applications/Xcode_2*.app 2>/dev/null | sort -V -r) $DEFAULT_XCODE"
          for APP in $CANDIDATES; do
            sudo xcode-select -s "$APP/Contents/Developer"
            ID=$(xcodebuild -project SnoreGuard.xcodeproj -scheme SnoreGuard -showdestinations 2>/dev/null \
              | grep "platform:iOS Simulator" | grep "name:iPhone" | grep -v "error" | tail -n 1 \
              | sed -E 's/.*id:([^,]+),.*/\1/')
            if [ -n "$ID" ]; then
              echo "Using $APP with simulator $ID"
              xcodebuild -version
              echo "id=$ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$APP has no iPhone simulator, trying the next Xcode"
          done
          xcrun simctl list runtimes
          echo "::error::No iPhone simulator available in any installed Xcode"
          exit 1

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project SnoreGuard.xcodeproj -scheme SnoreGuard \
            -destination "id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee build.log

      - name: Test
        run: |
          set -o pipefail
          xcodebuild -project SnoreGuard.xcodeproj -scheme SnoreGuard \
            -destination "id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log

      - name: Check for warnings and errors
        if: always()
        run: |
          cat build.log test.log 2>/dev/null | grep -E "(warning|error):" | sort -u > issues.txt || true
          echo "All issues reported by xcodebuild:"
          cat issues.txt
          grep -E "$GITHUB_WORKSPACE/SnoreGuard/(SnoreGuard|SnoreGuardTests|Config)/" issues.txt > project-issues.txt || true
          if [ -s project-issues.txt ]; then
            echo "::error::Warnings or errors in project sources"
            cat project-issues.txt
            exit 1
          fi
          echo "No warnings or errors in project sources."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            SnoreGuard/build.log
            SnoreGuard/test.log
            SnoreGuard/issues.txt
          if-no-files-found: ignore
