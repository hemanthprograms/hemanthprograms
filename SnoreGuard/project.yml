# XcodeGen spec. Generate the Xcode project with `xcodegen generate` (or `make project`).
name: SnoreGuard
options:
  bundleIdPrefix: com.hemanthprograms
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  SnoreGuard:
    type: application
    platform: iOS
    sources:
      - path: SnoreGuard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hemanthprograms.SnoreGuard
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  SnoreGuardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SnoreGuardTests
    dependencies:
      - target: SnoreGuard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hemanthprograms.SnoreGuardTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  SnoreGuard:
    build:
      targets:
        SnoreGuard: all
        SnoreGuardTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SnoreGuardTests
    archive:
      config: Release
